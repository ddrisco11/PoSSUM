[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "possum-politics"
version = "0.1.0"
description = "Political Slant Scoring Using Mixtures"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "torch>=2.4", "transformers>=4.48", "huggingface-hub>=0.26", "requests>=2.32"]
[project.optional-dependencies]
gliner = ["gliner2[local]"]
mlx = ["mlx-lm"]
dev = ["pytest>=8"]
data = ["pyarrow>=14"]
[project.scripts]
possum = "possum.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
possum = ["model_revisions.json"]
